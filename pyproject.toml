[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pogo-pings"
version = "0.1.0"
description = "Automated Pokémon GO promo code monitor with Discord alerts"
requires-python = ">=3.11"
authors = [
    { name = "pogo-pings contributors" }
]
license = "MIT"
dependencies = [
    "bs4",
    "httpx",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
